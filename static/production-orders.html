<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>商品图生产单</title>
    <link rel="stylesheet" href="/static/css/production-orders.css?v=1">
    <script src="/static/js/production-orders.js?v=1" defer></script>
</head>
<body>
    <main>
        <header>
            <h1>商品图生产单</h1>
            <p>先批准首色的主图和详情模块，再按各色参考图制作。</p>
        </header>
        <section aria-label="打开生产单">
            <div class="row">
                <label>生产单 <select id="orders"><option value="">选择生产单</option></select></label>
                <button type="button" id="refresh">刷新</button>
                <button type="button" id="new">新建生产单</button>
            </div>
            <p id="notice" role="status" aria-live="polite"></p>
        </section>
        <form id="create" hidden>
            <h2>新建同款生产单</h2>
            <div class="row">
                <label>款号<input name="style" required maxlength="80"></label>
                <label>商品名称<input name="title" required maxlength="120"></label>
            </div>
            <label>已核实商品资料<textarea name="facts" maxlength="1100" rows="2"></textarea></label>
            <label>本单使用的视觉规则<textarea name="visual_rules" maxlength="1100" rows="2"></textarea></label>
            <p>首行是代表色。每种颜色上传一张原图，或填写平台素材原图地址。</p>
            <div id="references"></div>
            <div class="row">
                <button type="button" id="add">添加颜色</button>
                <button class="primary" type="submit">保存生产单</button>
                <button type="button" id="cancel">取消</button>
            </div>
        </form>
        <section id="order" hidden>
            <div class="row">
                <h2 id="order-title"></h2>
                <button type="button" id="export">导出交付清单</button>
                <button type="button" id="zip">下载已批准图片</button>
            </div>
            <div class="row">
                <label>制作渠道<select id="provider"></select></label>
                <label>图像模型<select id="model"></select></label>
                <label>画幅<select id="size">
                    <option value="1024x1024">1:1</option>
                    <option value="1024x1536">2:3</option>
                    <option value="1536x1024">3:2</option>
                </select></label>
            </div>
            <label>制作要求<textarea id="instruction" rows="3" maxlength="1400" placeholder="例如：换成暖灰背景，保留衣服颜色和双拉链"></textarea></label>
            <button type="button" id="batch" disabled>制作其余颜色的未提交图位</button>
            <div id="colors"></div>
        </section>
    </main>
</body>
</html>
